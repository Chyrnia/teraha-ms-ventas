
server:
  port: 8081

spring:
  application:
    name: sales
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_LOCATION}
          authorities-claim-name: roles
          authority-prefix: ""
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

sales:
  paging:
    page-size: 5

# Configuración de Logs (SLF4J / Logback)
logging:
  level:
    root: INFO
    com.teraha.sales: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG
  file:
    name: ${LOGFILE}

# Configuración para acceder a la documentación de Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

products:
  service:
    url: http://products


app:
  cache:
    ttl:
      default-seconds: ${CACHE_TTL_DEFAULT_SECONDS:600}
      clients-seconds: ${SALES_CLIENTS_CACHE_TTL_SECONDS:300}
      sale-invoices-seconds: ${SALES_INVOICES_CACHE_TTL_SECONDS:300}
